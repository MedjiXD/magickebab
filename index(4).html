<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Stranica je u izradi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 38%,rgba(242,10,10,.10),transparent 35%),#050505}
body:before{content:"";position:absolute;inset:0;opacity:.035;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:44px 44px}
.page{position:relative;z-index:2;text-align:center;width:min(90vw,800px);padding-bottom:120px}
.logo{width:min(62vw,430px);margin:auto;filter:drop-shadow(0 0 32px rgba(242,10,10,.18));animation:float 4s ease-in-out infinite}
h1{margin:25px 0 8px;font-size:clamp(30px,5vw,52px);font-weight:900;text-transform:uppercase;letter-spacing:.03em}
h1 span{color:#f20a0a}.sub{margin:0;color:#aaa;font-size:clamp(15px,2vw,20px);letter-spacing:.12em;text-transform:uppercase}.line{width:85px;height:3px;background:#f20a0a;border-radius:4px;margin:24px auto;box-shadow:0 0 18px #f20a0a55}
.scene{position:absolute;z-index:3;bottom:0;left:0;width:100%;height:145px;pointer-events:none}.ground{position:absolute;bottom:0;width:100%;height:4px;background:#1d1d1d;border-top:1px solid #f20a0a66}
.exc{position:absolute;bottom:7px;left:-220px;width:235px;height:125px;animation:drive 15s linear infinite}
.track{position:absolute;bottom:4px;left:8px;width:130px;height:30px;border:6px solid #252525;border-radius:20px;background:repeating-linear-gradient(90deg,#111 0 10px,#303030 10px 13px)}
.body{position:absolute;left:28px;bottom:34px;width:92px;height:50px;background:#f20a0a;border-radius:14px 18px 5px 5px;box-shadow:0 7px 0 #b50000}
.cab{position:absolute;left:77px;bottom:67px;width:50px;height:45px;background:#151515;border:4px solid #f20a0a;border-radius:8px 12px 2px 2px;transform:skewX(-8deg)}
.window{position:absolute;inset:6px;background:linear-gradient(135deg,#292929,#070707);border:1px solid #555}
.boom{position:absolute;left:112px;bottom:82px;width:84px;height:13px;background:#f20a0a;border-radius:10px;transform-origin:7px 7px;transform:rotate(-24deg);animation:boom 3s ease-in-out infinite}
.stick{position:absolute;left:176px;bottom:117px;width:65px;height:11px;background:#f20a0a;border-radius:10px;transform-origin:5px 5px;transform:rotate(43deg);animation:stick 3s ease-in-out infinite}
.bucket{position:absolute;left:222px;bottom:76px;width:34px;height:31px;border:8px solid #f20a0a;border-top:0;border-radius:2px 2px 12px 12px;transform:rotate(26deg);transform-origin:5px 5px;animation:bucket 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes drive{0%{left:-240px}15%,85%{left:calc(50% - 118px)}100%{left:calc(100% + 20px)}}
@keyframes boom{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(-7deg)}}
@keyframes stick{0%,100%{transform:rotate(43deg)}50%{transform:rotate(22deg)}}
@keyframes bucket{0%,100%{transform:rotate(26deg)}50%{transform:rotate(4deg)}}
@media(max-width:600px){.page{padding-bottom:105px}.logo{width:min(72vw,340px)}.scene{height:120px}.exc{transform:scale(.78);transform-origin:bottom center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="page">
<div class="logo">
